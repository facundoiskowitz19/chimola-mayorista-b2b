# gcloud builds submit --config web/cloudbuild.yaml web --substitutions=_IMAGE=...,_APP_ENV=dev,_ADMIN_URL=...
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "--build-arg", "NEXT_PUBLIC_APP_ENV=${_APP_ENV}",
           "--build-arg", "NEXT_PUBLIC_ADMIN_URL=${_ADMIN_URL}", "--build-arg", "NEXT_PUBLIC_APP_VERSION=${_APP_VERSION}", "."]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _APP_ENV: dev
  _ADMIN_URL: ""
  _APP_VERSION: "dev"
